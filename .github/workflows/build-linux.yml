name: Build Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x64
            runner: ubuntu-latest
            flutter_arch: x64
            sfx: ""
          - arch: arm64
            target: arm64
            runner: ubuntu-24.04-arm
            flutter_arch: arm64
            sfx: "-arm64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter (x64 via action)
        if: matrix.flutter_arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
          cache: true

      - name: Setup Flutter (arm64 via git)
        if: matrix.flutter_arch == 'arm64'
        run: |
          sudo apt-get install -y git unzip xz-utils
          sudo git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
          sudo chown -R "$USER":"$USER" /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Ensure Linux platform files
        run: flutter create . --platforms=linux --org com.example

      - name: Remove default test file
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release (${{ matrix.target }})
        id: build
        run: flutter build linux --release --target-platform=linux-${{ matrix.target }} --verbose > build_log.txt 2>&1
        continue-on-error: true

      - name: Upload build log artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build_log.txt
          retention-days: 7

      - name: Check build result
        run: |
          tail -80 build_log.txt
          if [ -f build/linux/${{ matrix.target }}/release/bundle/void_terminal_linux ]; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED (see build-log artifact)"
            exit 1
          fi

      - name: Package tar.gz
        if: success()
        run: |
          cd build/linux/${{ matrix.target }}/release/bundle
          tar czf $GITHUB_WORKSPACE/VoidTerminal-Linux${{ matrix.sfx }}.tar.gz .
          cd $GITHUB_WORKSPACE
          ls -la VoidTerminal-Linux${{ matrix.sfx }}.tar.gz

      - name: Package deb
        if: success()
        run: |
          mkdir -p pkg/DEBIAN pkg/opt/void_terminal
          cat > pkg/DEBIAN/control <<EOF
          Package: void-terminal
          Version: 2.1.0
          Section: net
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Zhou-Yujing114514 <zhou@example.com>
          Description: VoidTerminal - 即时通讯客户端
          EOF
          cp -r build/linux/${{ matrix.target }}/release/bundle/* pkg/opt/void_terminal/
          dpkg-deb --build pkg void-terminal_2.1.0_${{ matrix.arch }}.deb
          ls -la void-terminal_2.1.0_${{ matrix.arch }}.deb

      - name: Upload artifacts (on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoidTerminal-Linux${{ matrix.sfx }}
          path: |
            VoidTerminal-Linux${{ matrix.sfx }}.tar.gz
            void-terminal_2.1.0_${{ matrix.arch }}.deb
          retention-days: 30
